# Hero — the whole proposition above the fold, then one action.
#
# `positioning` was its own full section ("What GhantiPlus Is / Is Not"). It is the
# sharpest line on the site and it was sitting below the fold behind a heading
# nobody needed; it belongs here, where it does its work in one breath.
#
# The Hindi H1 with an English subline is deliberate. Most Indian startups lead
# in English and lose the warmth — keep this order.

video:
  youtube_id: "A3FuaDJOvzU"
  title: "GhantiPlus story — the digital bell for feriwale"

headline_hindi: "Aapke feriwale ab online hain."

subhead: "Kulfiwala, repairwala, sabziwala, bike washer, ganne ka ras — see who is online near your society, and when one rings the digital bell at your gate, GhantiPlus shows it in the app."

positioning: "Not a map. Not a shop. Just a digital ghanti."

cta_text: "Get Early Access on WhatsApp"

launch_message: "Launching in Pune. More towns and villages soon."
